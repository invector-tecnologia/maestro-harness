[package]
name = "maestro"
version = "0.1.0"
edition = "2021"
description = "Maestro — a local-first, tactical Agentic Workflow Orchestrator (Rust core)."
license = "GPL-3.0-only"
repository = "https://github.com/invector-tecnologia/maestro-ai-harness"
readme = "README.md"
rust-version = "1.80"

[[bin]]
name = "maestro"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"

[profile.release]
strip = true
lto = "thin"
